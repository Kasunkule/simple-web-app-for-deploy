name: Deploy React App to EC2

on:
  push:
    branches:
      - master    # when push something to the master branch, then trigger.

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4  # checkout to the instance/virtual mashing

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/id_rsa # referring .pem file
          chmod 600 ~/.ssh/id_rsa         # 600 = read and write only
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy build to EC2
        run:
          rsync -avz dist/ \    # sync the build file with the instance. 
          ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:${{ secrets.EC2_APP_PATH }}